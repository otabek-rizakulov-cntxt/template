name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/template?schema=public
      JWT_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret-at-least-32-characters
      JWT_EXPIRATION_TIME: '900'
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: '604800'
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Lint
        run: pnpm run lint -- --max-warnings=0

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test -- --coverage --ci

      - name: Build
        run: pnpm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: template:ci
      # A regression guard for the .dockerignore/COPY mismatch that once shipped
      # an image containing no application code at all.
      - name: Verify the image contains the compiled app
        run: docker run --rm --entrypoint node template:ci -e "require('fs').accessSync('/app/dist/main.js')"
