services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d template']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the host from .env: inside the compose network the database is
      # reachable by service name, not on localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template?schema=public
      APP_PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres-data:
